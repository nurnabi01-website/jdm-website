<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Say - JDM Agency</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f3f4f6;
        }

        /* --- Header (এই অংশটি index.html এর মতোই) --- */
        /* ... (আগের index.html এর Header CSS কোডগুলো এখানে বসবে) ... */

        /* --- Page Banner --- */
        .page-banner {
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://via.placeholder.com/1920x400'); /* এখানে ব্যানারের অরিজিনাল ছবি বসবে */
            background-size: cover;
            background-position: center;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
        }

        .page-banner h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .page-banner p {
            font-size: 16px;
        }

        .page-banner p a {
            color: #e50000;
            text-decoration: none;
        }

        /* --- Video Gallery Section --- */
        .video-gallery {
            padding: 60px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Featured Video (Top Large Video) */
        .featured-video {
            margin-bottom: 40px;
            width: 100%;
        }
        
        .featured-video iframe {
            width: 100%;
            height: 500px; /* ডেস্কটপের জন্য বড় সাইজ */
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Grid Videos */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .video-item {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }

        .video-item:hover {
            transform: translateY(-5px);
        }

        .video-item iframe {
            width: 100%;
            height: 250px;
            border: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
            .featured-video iframe {
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <!-- (এখানে আগের index.html এর সম্পূর্ণ <header>...</header> কোডটি পেস্ট করবেন) -->

    <!-- ==================== PAGE BANNER ==================== -->
    <section class="page-banner">
        <h1>Client Say</h1>
        <p><a href="index.html">Home</a> / Client Say</p>
    </section>

    <!-- ==================== VIDEO GALLERY ==================== -->
    <section class="video-gallery">
        <div class="container">
            
            <!-- Featured Video (বড় ভিডিওটি) -->
            <div class="featured-video">
                <!-- YouTube এর Embed Code এখানে বসাবেন -->
                <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_HERE" title="YouTube video player" allowfullscreen></iframe>
            </div>

            <!-- Video Grid (ছোট ভিডিওগুলো) -->
            <div class="video-grid">
                
                <!-- Video 1 -->
                <div class="video-item">
                    <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_HERE" allowfullscreen></iframe>
                </div>

                <!-- Video 2 -->
                <div class="video-item">
                    <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_HERE" allowfullscreen></iframe>
                </div>

                <!-- Video 3 -->
                <div class="video-item">
                    <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_HERE" allowfullscreen></iframe>
                </div>

                <!-- Video 4 -->
                <div class="video-item">
                    <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_HERE" allowfullscreen></iframe>
                </div>
                
                <!-- আরও ভিডিও লাগলে এই ব্লকটি কপি করে নিচে বসাবেন -->

            </div>
        </div>
    </section>

    <!-- ==================== FOOTER ==================== -->
    <!-- (এখানে আগের index.html এর সম্পূর্ণ <footer>...</footer> কোডটি পেস্ট করবেন) -->

</body>
</html>
